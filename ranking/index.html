<style>
:root{
  --navy:#0b345c; --navy2:#0f4f7a; --cel:#1cb5e0; --cel2:#0a8fc4; --cel-l:#e3f5fc; --ice:#f2f8fc;
  --bg:#e8f0f6; --line:#d8e4ee; --txt:#16324a; --mut:#6b829a;
  --yel:#ffc72c; --yel-l:#fff4d1; --red:#e04a3a; --red-l:#fde8e5; --grn:#119b6b; --grn-l:#e1f6ee;
  --c0:#ffc72c; --c1:#0b5d8a; --c2:#1c9ad6; --c3:#8fd3f0; --c4:#e86a55;
}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;color:var(--txt);background:linear-gradient(180deg,#dcebf5 0,#eef4f9 320px,#eef4f9 100%);min-height:100vh}
.wrap{max-width:1500px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:22px;box-shadow:0 6px 24px rgba(11,52,92,.08);border:1px solid #e6eef5}
/* header */
.head{display:flex;gap:22px;align-items:center;padding:18px 22px;flex-wrap:wrap}
.logo{width:104px;height:104px;border-radius:22px;border:1px solid var(--line);display:grid;place-items:center;background:#fff;flex:none}
.logo img{width:92px;height:92px}
.ttl h1{margin:0;font-weight:900;font-size:clamp(34px,5vw,58px);line-height:.95;color:var(--navy);letter-spacing:.5px}
.ttl h2{margin:6px 0 0;font-weight:900;font-size:clamp(18px,2.4vw,26px);color:var(--cel);letter-spacing:3px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{display:flex;align-items:center;gap:8px;padding:11px 15px;border-radius:14px;border:1px solid var(--line);font-weight:700;font-size:13px;background:#fff;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--cel);box-shadow:0 0 0 4px var(--cel-l)}
.chip.y{background:var(--yel-l);border-color:#f5d77a}.chip.y i{background:var(--yel);box-shadow:0 0 0 4px #fff0c2}
.chip.r i{background:var(--red);box-shadow:0 0 0 4px var(--red-l)}
.btn{font-family:inherit;font-weight:800;font-size:13px;border-radius:14px;padding:12px 18px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(11,52,92,.12)}
.btn.pri{background:linear-gradient(135deg,#2cc4ec,#0a8fc4);color:#fff;border:none;box-shadow:0 6px 16px rgba(10,143,196,.35);text-transform:uppercase;letter-spacing:.5px}
.btn.dk{background:linear-gradient(135deg,#145f84,#0b345c);color:#fff;border:none}
.btn.sm{padding:8px 12px;font-size:12px;border-radius:11px}
/* controls */
.ctrl{margin-top:14px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12px;font-weight:800;color:var(--navy2)}
select,input[type=text],input[type=number]{font-family:inherit;font-weight:600;font-size:13px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--txt);min-width:130px}
input[type=number]{min-width:0;width:86px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tab{font-family:inherit;font-weight:800;font-size:13px;padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;letter-spacing:.3px}
.tab.on{background:linear-gradient(135deg,#2cc4ec,#0a8fc4);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(10,143,196,.3)}
/* panel */
.panel{padding:20px 22px 24px}
.ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ph img{width:52px;height:52px}
.ph h3{margin:0;font-size:24px;font-weight:900;color:var(--navy);letter-spacing:.3px}
.ph .sub{font-size:12.5px;font-weight:700;color:var(--mut);margin-top:3px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tw{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{background:var(--navy);color:#fff;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:11px 10px;text-align:left;white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none}
th.n,td.n{text-align:right}
th:first-child{border-top-left-radius:15px}th:last-child{border-top-right-radius:15px}
td{padding:9px 10px;border-bottom:1px solid #edf2f7;white-space:nowrap;font-weight:600}
tr:nth-child(even) td{background:#f8fbfd}
tr:hover td{background:var(--cel-l)}
td.nm{font-weight:800;color:var(--navy)}
.pos{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#eef4f9;font-weight:900;color:var(--navy);font-size:12.5px}
.pos.g{background:var(--yel);color:var(--navy);box-shadow:0 3px 8px rgba(255,199,44,.5)}
.pos.s{background:#cfe9f7}.pos.b{background:#e2f2fa}
.bar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar span{display:block;height:8px;border-radius:5px;background:linear-gradient(90deg,#8fd3f0,#0a8fc4);min-width:2px}
.bar .bk{width:80px;height:8px;border-radius:5px;background:#e8f1f7;overflow:hidden}
.pp{font-weight:800;border-radius:8px;padding:3px 8px;display:inline-block}
.pp.up{color:var(--grn);background:var(--grn-l)}.pp.dn{color:var(--red);background:var(--red-l)}.pp.eq{color:var(--mut);background:#eef3f7}
.cl{display:inline-block;font-size:11px;font-weight:900;padding:4px 9px;border-radius:999px;letter-spacing:.3px}
.tag{font-size:10px;font-weight:900;padding:3px 7px;border-radius:7px;background:var(--yel);color:var(--navy);margin-left:6px}
/* resumen */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{border:1px solid var(--line);border-radius:18px;padding:15px 16px;background:linear-gradient(180deg,#fff,#f6fbfe)}
.kpi b{display:block;font-size:30px;font-weight:900;color:var(--navy);line-height:1.1}
.kpi small{font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi.hl{background:linear-gradient(135deg,#fff7dc,#ffe9a3);border-color:#f3cf63}
.kpi.bad{background:linear-gradient(135deg,#fff,#fde8e5);border-color:#f3b8ae}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.box{border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.box h4{margin:0 0 10px;font-size:14px;font-weight:900;color:var(--navy);text-transform:uppercase;letter-spacing:.5px}
.podio{display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#f5fafd}
.prow.g{background:var(--yel-l);border:1px solid #f3d77d}
.prow .who{flex:1;min-width:0}.prow .who b{display:block;font-size:13px;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .who small{font-size:11px;color:var(--mut);font-weight:700}
.prow .v{font-weight:900;font-size:15px;color:var(--navy)}
.prow.al{background:var(--red-l)}
.stack{display:flex;height:26px;border-radius:9px;overflow:hidden;margin:6px 0}
.stack div{display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--navy);min-width:0;overflow:hidden}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;font-weight:800}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:4px}
.drow{display:grid;grid-template-columns:200px 1fr 46px;gap:10px;align-items:center;font-size:12.5px;font-weight:800;color:var(--navy);margin:6px 0}
.edvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.edv{border:1px solid var(--line);border-radius:18px;padding:14px 16px;position:relative}
.edv.g{background:linear-gradient(135deg,#fff7dc,#ffeaa8);border-color:#f3cf63}
.edv .rk{position:absolute;top:12px;right:14px;font-weight:900;font-size:22px;color:#c9dbe8}
.edv b{font-size:15px;color:var(--navy);font-weight:900}
.edv .big{font-size:30px;font-weight:900;color:var(--navy);margin:4px 0}
.edv small{display:block;font-size:11px;font-weight:700;color:var(--mut)}
.hm td.m{font-weight:800;text-align:center;font-size:11.5px;padding:7px 3px}.hm th{padding:11px 6px}.hm td{padding:8px 6px}
.note{font-size:12px;color:var(--mut);font-weight:600;margin-top:10px}
.drop{position:fixed;inset:0;background:rgba(11,52,92,.82);display:none;place-items:center;z-index:50;color:#fff;font-size:30px;font-weight:900;text-align:center}
.drop.on{display:grid}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:14px 20px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;display:none;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cap .tw{overflow:visible}.cap table{width:max-content;min-width:100%}.cap .acts{display:none!important}.cap th{position:static}
.snap{position:relative}.snapb{position:absolute;top:8px;right:8px;z-index:3;font-family:inherit;font-size:11px;font-weight:800;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:5px 8px;cursor:pointer;opacity:.75}.snapb:hover{opacity:1;background:var(--cel-l)}.capping .snapb,.capping .acts{display:none!important}.capping.tw,.capping .tw{overflow:visible}.capping table{width:max-content;min-width:100%}.capping th{position:static}
table[data-id="t_TARD"] th{white-space:normal;line-height:1.25;min-width:84px;vertical-align:bottom}
.glg .sw{border:1.5px solid;border-radius:999px;padding:3px 10px;color:var(--navy)}.glg{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--mut);margin:0 0 10px;flex-wrap:wrap}.glg i{display:inline-block;width:70px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgb(246,170,160),rgb(255,222,120))}.glg i.b{background:linear-gradient(90deg,rgb(255,222,120),rgb(120,200,240))}.glg small{margin-left:10px}
.tip{position:absolute;pointer-events:none;background:#0b345c;color:#fff;border-radius:12px;padding:10px 13px;font-size:12px;font-weight:600;line-height:1.55;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:5;min-width:190px;display:none}.tip b{font-size:14px}.tip .r{display:flex;justify-content:space-between;gap:14px}.tip .up{color:#6ee7b7}.tip .dn{color:#fca5a5}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}.pcard{border:1px solid var(--line);border-radius:18px;padding:15px 16px;background:linear-gradient(180deg,#fff,#f4fafe)}.pcard .top{display:flex;justify-content:space-between;align-items:flex-start}.pcard h5{margin:0;font-size:15px;font-weight:900;color:var(--navy);letter-spacing:.4px}.pcard .pe{font-size:34px;font-weight:900;color:var(--cel2);line-height:1}.pcard .meta{font-size:11.5px;font-weight:700;color:var(--mut);margin:4px 0 10px}.pcard .vr{display:grid;grid-template-columns:1fr 52px 52px;gap:6px;align-items:center;font-size:12px;font-weight:700;padding:5px 0;border-top:1px dashed #e1eaf1}.pcard .vr span:nth-child(n+2){text-align:right}.pcard .hd{font-size:10px;color:var(--mut);font-weight:800;text-transform:uppercase;border-top:none}
.hv{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.flt button{font-family:inherit;font-weight:800;font-size:11.5px;border-radius:999px;padding:6px 12px;border:2px solid transparent;cursor:pointer}
.flt button.on{border-color:var(--navy)}
@media(max-width:700px){.ctrl{gap:10px}.ctrl .fld{flex:1 1 45%}.ctrl select,.ctrl input[type=text]{min-width:0;width:100%}.chip{padding:8px 11px;font-size:12px}.head{gap:14px}.ttl{flex:1}.wrap{padding:10px}.head{padding:14px}.logo{width:76px;height:76px}.logo img{width:66px;height:66px}.chips{margin-left:0}.drow{grid-template-columns:120px 1fr 40px}}
</style>
</head>

function build(rows){
  const tot=rows.reduce((a,r)=>a+r[7],0)||1;
  return rows.map(r=>({d:r[0],s:r[1],r:r[2],p:r[3],val:r[4],inv:r[5],just:r[6],env:r[7],
    pv:r[7]?r[4]/r[7]:null,pi:r[7]?r[5]/r[7]:null,pj:r[7]?r[6]/r[7]:null,peso:r[7]/tot,edv:edvOf(r[0])}));
}

function table(id,cols,data,defSort){
  let s=st.sort&&st.sort.id===id?st.sort:defSort?{id,...defSort}:null;
  if(s){const c=cols[s.c];if(c&&c.v){data=[...data].sort((a,b)=>{const A=c.v(a),B=c.v(b);if(A==null&&B==null)return 0;if(A==null)return 1;if(B==null)return -1;return (A>B?1:A<B?-1:0)*(s.dir)})}}
  const rk=data.map((x,i)=>i+1);
  data.forEach((x,i)=>x._rk=i+1);
  const vis=cols.map((c,i)=>[c,i]).filter(([c])=>!c.hide);
  const h=`<div class="tw"><table data-id="${id}"><thead><tr>${vis.map(([c,i])=>`<th class="${c.t&&c.t!=='txt'?'n':''}" data-c="${i}">${c.h}${s&&s.c===i?(s.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${
    data.map((x,i)=>`<tr>${vis.map(([c])=>`<td class="${c.cls||''} ${c.t&&c.t!=='txt'?'n':''}">${c.html?c.html(x,i):fmt(c.v(x),c.t)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${vis.length}" style="text-align:center;color:var(--mut);padding:24px">Sin datos para estos filtros</td></tr>`}</tbody></table></div>`;
  EXP[id]={cols,data};

}

  const all=build(perRows()), L=filt(all,true), A=aggr(L), t=tgt();
  const pm=prevMesOf(perMes()), PA=pm?aggr(filt(build(HIST[pm]),true)):null;
  const nE=L.filter(x=>clOf(x.pv)===CLS[0]).length;
  const sInfo=(rows,m,cur)=>{const l=filt(build(rows),true),a=aggr(l);return{m,cur,v:a.pv,env:a.env,pj:a.pj,np:l.length,est:l.filter(x=>clOf(x.pv)===CLS[0]).length,c4:l.filter(x=>x.env>0&&clOf(x.pv)===CLS[4]).length}};
  const series=[...HMONTHS.filter(m=>MESES.indexOf(m)<=MESES.indexOf(isAct()?'DIC':perMes())).map(m=>sInfo(HIST[m],m,false))];
  if(isAct())series.push(sInfo(cur.rows,cur.mes,true));
  window._ser=series;window._tgt=isAct()?t:null;
  let h=headP('RESUMEN',perLabel()+filtLabel());
  h+=`<div class="snap" style="padding-top:34px">${SNAP('KPIs')}<div class="kpis">
   <div class="kpi ${isAct()&&A.pv<t?'bad':'hl'}"><small>% Validadas</small><b>${pct(A.pv)}</b>${isAct()?`<small>vs TGT ${nf1.format(t*100)}%: ${ppf(A.pv-t)}</small>`:''}</div>
   <div class="kpi"><small>vs ${pm||'—'} (cierre)</small><b>${PA?ppHtml(A.pv-PA.pv,true):'—'}</b><small>${PA?pct(PA.pv)+' en '+pm:''}</small></div>
   <div class="kpi"><small># Enviadas</small><b>${nf0.format(A.env)}</b><small>${nf0.format(A.val)} validadas</small></div>
   <div class="kpi"><small>% Justificadas</small><b>${pct(A.pj)}</b><small>${nf0.format(A.just)} justificadas</small></div>
   <div class="kpi"><small>PV Estrella</small><b>${nE} <span style="font-size:15px;color:var(--mut)">/ ${L.length}</span></b><small>promotores &gt;90%</small></div>
  </div></div>`;
  h+=`<div class="box chart snap" style="margin-bottom:14px">${SNAP('Evolucion')}<h4>Evolución % validadas ${ANIO} <span style="font-size:11px;color:var(--mut);text-transform:none;font-weight:700">· pasá el mouse por cada mes</span></h4>${lineChart(series,isAct()?t:null)}<div class="tip" id="tip"></div></div>`;
  h+=`<div class="grid2">`;
  ROLES.forEach(R=>{
    const l=L.filter(x=>x.r===R.rol&&x.env>0).sort((a,b)=>b.pv-a.pv||b.env-a.env);
    h+=`<div class="box snap">${SNAP('Top_'+R.label)}<h4>🏆 Top 3 ${R.label}</h4><div class="podio">${l.slice(0,3).map((x,i)=>`<div class="prow ${i===0?'g':''}"><span class="pos ${i===0?'g':i===1?'s':'b'}">${i+1}</span><div class="who"><b>${esc(x.p)}</b><small>${esc(x.d)} · ${esc(x.s)}</small></div><span class="v">${pct(x.pv)}</span></div>`).join('')||'<div class="note">Sin datos</div>'}</div>
    <h4 style="margin-top:14px">⚠ A mirar</h4><div class="podio">${l.slice(-3).reverse().filter(x=>l.length>3).map(x=>`<div class="prow al"><span class="pos">${l.indexOf(x)+1}</span><div class="who"><b>${esc(x.p)}</b><small>${esc(x.d)} · ${esc(x.s)}</small></div><span class="v">${pct(x.pv)}</span></div>`).join('')}</div></div>`;
  });
  const cnt=CLS.map(c=>L.filter(x=>clOf(x.pv)===c).length), tot=cnt.reduce((a,b)=>a+b,0)||1;
  h+=`<div class="box snap">${SNAP('Clusters')}<h4>Clusters</h4>${stackBar(cnt)}<div class="podio" style="margin-top:10px">${CLS.map((c,i)=>`<div class="prow"><span class="cl" style="background:${c.bg};color:${c.fg}">${c.k}</span><div class="who"><small>${c.d}</small></div><span class="v">${cnt[i]} · ${nf1.format(cnt[i]/tot*100)}%</span></div>`).join('')}</div></div>`;
  h+=`</div>`;
  return h;
}
function stackBar(cnt){const tot=cnt.reduce((a,b)=>a+b,0)||1;return `<div class="stack">${CLS.map((c,i)=>cnt[i]?`<div style="width:${cnt[i]/tot*100}%;background:${c.bg};color:${c.fg}" title="${c.k}: ${cnt[i]}">${cnt[i]/tot>.06?cnt[i]:''}</div>`:'').join('')}</div>`}
function lineChart(s,t){
  if(!s.length)return'';
  const W=900,H=240,pl=44,pr=20,pt=24,pb=34;const vals=s.map(x=>x.v).filter(v=>v!=null).concat(t?[t]:[]);
  let mn=Math.floor(Math.min(...vals)*20)/20-.02,mx=Math.min(1,Math.ceil(Math.max(...vals)*20)/20+.02);
  const X=i=>pl+(s.length===1?0:(W-pl-pr)*i/(s.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let g='';for(let v=Math.ceil(mn*20)/20;v<=mx+1e-9;v+=.05)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e3edf4"/><text x="${pl-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#6b829a" font-weight="700">${Math.round(v*100)}%</text>`;
  if(t)g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#ffc72c" stroke-width="2.5" stroke-dasharray="7 5"/><text x="${pl+8}" y="${Y(t)-6}" text-anchor="start" font-size="11.5" font-weight="900" fill="#b8860b">TGT ${nf1.format(t*100)}%</text>`;
  const pts=s.map((x,i)=>x.v==null?null:[X(i),Y(x.v)]).filter(Boolean);
  const area=`M${pts[0][0]},${H-pb} `+pts.map(p=>`L${p[0]},${p[1]}`).join(' ')+` L${pts[pts.length-1][0]},${H-pb} Z`;
  return `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1cb5e0" stop-opacity=".28"/><stop offset="1" stop-color="#1cb5e0" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#ga)"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#0a8fc4" stroke-width="3.5" stroke-linejoin="round"/>${s.map((x,i)=>x.v==null?'':`<circle cx="${X(i)}" cy="${Y(x.v)}" r="${x.cur?7:5}" fill="${x.cur?'#ffc72c':'#fff'}" stroke="#0b345c" stroke-width="2.5"/><text x="${X(i)}" y="${Y(x.v)-12}" text-anchor="middle" font-size="11.5" font-weight="900" fill="#0b345c">${nf1.format(x.v*100)}</text><text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="11.5" font-weight="800" fill="${x.cur?'#0a8fc4':'#6b829a'}">${x.m}${x.cur?'*':''}</text><rect class="hpt" data-i="${i}" x="${X(i)-28}" y="${pt-10}" width="56" height="${H-pt-pb+20}" fill="transparent" style="cursor:pointer"/>`).join('')}</svg>${isAct()?'<div class="note">* mes en curso (no cerrado)</div>':''}`;
}

function pROL(R){
  const all=build(perRows()), L=filt(all).filter(x=>x.r===R.rol), t=tgt();
  const pm=prevMesOf(perMes()), PM=pm?histMaps[pm]:{};
  const PL=isAct()&&prevLoad?mapBy(prevLoad.rows):null;
  const cols=[
    {h:'#',v:x=>x._rk,html:posH,t:'int'},
    {h:'Distri / Directa',v:x=>x.d},{h:'SPV',v:x=>x.s},
    {h:'Promotor',v:x=>x.p,cls:'nm',html:x=>esc(x.p)+(!ytdOf(x.p).n?'<span class="tag">NUEVO</span>':'')},
    {h:'% Validadas',v:x=>x.pv,t:'pct',html:x=>barH(x.pv)},
    {h:'# Validadas',v:x=>x.val,t:'int'},{h:'% Inv',v:x=>x.pi,t:'pct'},{h:'# Inv',v:x=>x.inv,t:'int'},
    {h:'% Justif',v:x=>x.pj,t:'pct'},{h:'# Just',v:x=>x.just,t:'int'},{h:'# Enviadas',v:x=>x.env,t:'int'},{h:'% Peso',v:x=>x.peso,t:'pct'},
  ];
  if(isAct())cols.push({h:'vs TGT',v:x=>x.pv-t,t:'pp',html:x=>ppHtml(x.pv-t)});
  cols.push({h:'Cluster',v:x=>clOf(x.pv)?.k,html:x=>clHtml(x.pv)});
  if(pm)cols.push({h:'vs '+pm,v:x=>PM[x.p]?x.pv-PM[x.p].pv:null,t:'pp',html:x=>ppHtml(PM[x.p]?x.pv-PM[x.p].pv:null,true)});
  if(PL)cols.push({h:'vs carga ant.',v:x=>PL[x.p]?x.pv-PL[x.p].pv:null,t:'pp',html:x=>ppHtml(PL[x.p]?x.pv-PL[x.p].pv:null,true)});
  const A=aggr(L);
  return headP('RANKING '+R.label,perLabel()+filtLabel()+` · ${L.length} promotores · ${pct(A.pv)} validadas`,'t_'+R.k)+table('t_'+R.k,cols,L,{c:4,dir:-1})+(PL?`<div class="note">Carga anterior para comparar: ${esc(prevLoad.fecha)}</div>`:'');
}

function grpSPV(list){const g={};list.forEach(x=>{const k=x.d+'|'+x.s;(g[k]=g[k]||{d:x.d,s:x.s,edv:x.edv,items:[]}).items.push(x)});return Object.values(g).map(o=>({...o,...aggr(o.items),peso:o.items.reduce((a,x)=>a+x.peso,0),np:o.items.length}))}
function pSPV(){
  const L=filt(build(perRows()),true), t=tgt(), pm=prevMesOf(perMes());
  const PG={};if(pm)grpSPV(filt(build(HIST[pm]),true)).forEach(o=>PG[o.d+'|'+o.s]=o);
  const G=grpSPV(L);
  const cols=[{h:'#',v:x=>x._rk,html:posH,t:'int'},{h:'Distri / Directa',v:x=>x.d},{h:'SPV',v:x=>x.s,cls:'nm'},
    {h:'% Validadas',v:x=>x.pv,t:'pct',html:x=>barH(x.pv)},{h:'% Justif',v:x=>x.pj,t:'pct'},{h:'% Peso',v:x=>x.peso,t:'pct'},{h:'# Enviadas',v:x=>x.env,t:'int'},{h:'Promotores',v:x=>x.np,t:'int'}];
  if(isAct())cols.push({h:'vs TGT',v:x=>x.pv-t,t:'pp',html:x=>ppHtml(x.pv-t)});
  if(pm)cols.push({h:'vs '+pm,v:x=>PG[x.d+'|'+x.s]?x.pv-PG[x.d+'|'+x.s].pv:null,t:'pp',html:x=>ppHtml(PG[x.d+'|'+x.s]?x.pv-PG[x.d+'|'+x.s].pv:null,true)});
  const curG=grpSPV(filt(build(cur.rows),true)), HG={};HMONTHS.forEach(m=>{HG[m]={};grpSPV(filt(build(HIST[m]),true)).forEach(o=>HG[m][o.d+'|'+o.s]=o.pv)});
  const yt=ytdTable('t_SPVY','YTD SUPERVISORES',curG,[{h:'Distri / Directa',v:x=>x.d},{h:'SPV',v:x=>x.s,cls:'nm'}],(m,it)=>HG[m][it.d+'|'+it.s]??null,it=>it.pv);
  return '<div class="snap">'+headP('RANKING SUPERVISORES',perLabel()+filtLabel(),'t_SPV')+table('t_SPV',cols,G,{c:3,dir:-1})+'</div>'+yt;
}
function pEDV(){
  const L=filt(build(perRows()),true), t=tgt();
  const D={};L.forEach(x=>(D[x.d]=D[x.d]||[]).push(x));
  const DL=Object.keys(D).map(d=>({d,edv:edvOf(d),...aggr(D[d]),peso:D[d].reduce((a,x)=>a+x.peso,0)}));
  const E=Object.keys(EDV_MAP).map(e=>{const ds=DL.filter(x=>x.edv===e);return{e,ds,pv:ds.length?ds.reduce((a,x)=>a+x.pv,0)/ds.length:null,pj:ds.length?ds.reduce((a,x)=>a+x.pj,0)/ds.length:null,env:ds.reduce((a,x)=>a+x.env,0),peso:ds.reduce((a,x)=>a+x.peso,0)}}).filter(x=>x.ds.length).sort((a,b)=>b.pv-a.pv);
  let h='<div class="snap">'+headP('RANKING EDV',perLabel()+filtLabel(),'t_EDV');
  h+=`<div class="snap" style="padding-top:34px;margin-bottom:6px">${SNAP('EDV_tarjetas')}<div class="edvs">${E.map((x,i)=>`<div class="edv ${i===0?'g':''}"><span class="rk">#${i+1}</span><b>${esc(x.e)}</b><div class="big">${pct(x.pv)}</div>${isAct()?ppHtml(x.pv-t):''}<small style="margin-top:6px">${x.ds.map(d=>esc(d.d)).join(' · ')}</small><small>${nf0.format(x.env)} enviadas · ${pct(x.pj)} justif.</small></div>`).join('')}</div></div>`;
  const cols=[{h:'#',v:x=>x._rk,html:posH,t:'int'},{h:'EDV',v:x=>x.edv,cls:'nm'},{h:'Distri',v:x=>x.d},{h:'% Validadas',v:x=>x.pv,t:'pct',html:x=>barH(x.pv)},{h:'% Justif',v:x=>x.pj,t:'pct'},{h:'# Enviadas',v:x=>x.env,t:'int'},{h:'% Peso',v:x=>x.peso,t:'pct'}];
  if(isAct())cols.push({h:'vs TGT',v:x=>x.pv-t,t:'pp',html:x=>ppHtml(x.pv-t)});
  h+=table('t_EDV',cols,DL,{c:3,dir:-1});
  h+=`<div class="note">% del EDV = promedio del % validadas de sus distribuidores (como en la planilla).</div></div>`;
  const HE={};HMONTHS.forEach(m=>HE[m]=edvPv(HIST[m]));const CE=edvPv(cur.rows);
  h+=ytdTable('t_EDVY','YTD EDV',Object.keys(EDV_MAP).filter(e=>!st.edv||e===st.edv).map(e=>({e})),[{h:'EDV',v:x=>x.e,cls:'nm'}],(m,it)=>HE[m][it.e],it=>CE[it.e]);
  return h;
}

function ytdTable(id,title,items,keyName,monthVal,actVal){
  const tint=v=>{const c=clOf(v);if(!c)return '';return `background:${c.hex}${c===CLS[0]?'55':c===CLS[4]?'40':c===CLS[3]?'66':'30'}`};
  const L=items.map(it=>{const o={...it};const vs=[];HMONTHS.forEach(m=>{const v=monthVal(m,it);o['m_'+m]=v;if(v!=null)vs.push(v)});o.ytd=vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null;o.n=vs.length;o.act=actVal(it);return o});
  const cols=[{h:'#',v:x=>x._rk,html:posH,t:'int'},...keyName,
    {h:'YTD',v:x=>x.ytd,t:'pct',html:x=>`<b style="font-size:14px">${pct(x.ytd)}</b>`},
    {h:cur.mes+' (actual)',v:x=>x.act,t:'pct',html:x=>`<b style="color:var(--cel2)">${pct(x.act)}</b>`},
    {h:'Actual vs YTD',v:x=>x.ytd!=null&&x.act!=null?x.act-x.ytd:null,t:'pp',html:x=>ppHtml(x.ytd!=null&&x.act!=null?x.act-x.ytd:null,true)},
    {h:`Tendencia ${HMONTHS[0]}–${cur.mes}`,noX:true,html:x=>spark(x)},{h:`Mes a mes ${HMONTHS[0]}–${HMONTHS[HMONTHS.length-1]}`,noX:true,html:x=>bars(x)},
    ...HMONTHS.map(m=>({h:m,hide:true,v:x=>x['m_'+m],t:'pct'}))];
  return `<div class="snap" style="margin-top:26px;padding:6px">${SNAP(id.replace('t_',''))}<div class="ph" style="margin:0 0 12px"><img src="${LOGO}" alt=""><div><h3 style="font-size:19px">${title}</h3><div class="sub">YTD = promedio del % validadas de cada mes cerrado ${HMONTHS[0]}–${HMONTHS[HMONTHS.length-1]} · 🟢 80%+ · 🟡 70–80% · 🔴 &lt;70% · punto grande con borde = mes en curso</div></div><div class="acts" style="margin-right:80px"><button class="btn sm dk" onclick="dlXls('${id}')">⬇ Excel YTD</button></div></div><div class="hm">${table(id,cols,L,{c:keyName.length+1,dir:-1})}</div></div>`;
}
function edvPv(rows){const L=filt(build(rows),true);const D={};L.forEach(x=>(D[x.d]=D[x.d]||[]).push(x));const r={};Object.keys(EDV_MAP).forEach(e=>{const ds=Object.keys(D).filter(d=>edvOf(d)===e).map(d=>aggr(D[d]).pv).filter(v=>v!=null);r[e]=ds.length?ds.reduce((a,b)=>a+b,0)/ds.length:null});return r}
const pTGT_END=1;
function pJUS(){
  const L=filt(build(perRows())).filter(x=>x.env>0);
  const cols=[{h:'#',v:x=>x._rk,html:posH,t:'int'},{h:'Distri / Directa',v:x=>x.d},{h:'SPV',v:x=>x.s},{h:'Rol',v:x=>x.r},{h:'Promotor',v:x=>x.p,cls:'nm'},
    {h:'% Justificadas',v:x=>x.pj,t:'pct',html:x=>`<b style="color:${x.pj>=.2?'var(--red)':'var(--navy)'}">${pct(x.pj)}</b>`},{h:'# Just',v:x=>x.just,t:'int'},{h:'% Validadas',v:x=>x.pv,t:'pct'},{h:'# Enviadas',v:x=>x.env,t:'int'},{h:'Cluster',v:x=>clOf(x.pv)?.k,html:x=>clHtml(x.pv)}];
  return headP('RANKING MÁS JUSTIFICACIÓN',perLabel()+filtLabel()+' · de mayor a menor % justificadas','t_JUS')+table('t_JUS',cols,L,{c:5,dir:-1});
}
function pCRE(){
  const pm=prevMesOf(perMes());
  if(!pm)return headP('CRECIMIENTO',perLabel())+'<div class="note">No hay mes anterior cerrado para comparar.</div>';
  const PM=histMaps[pm];
  const L=filt(build(perRows())).map(x=>({...x,prev:PM[x.p]?PM[x.p].pv:null,cre:PM[x.p]&&x.pv!=null?x.pv-PM[x.p].pv:null}));
  const up=L.filter(x=>x.cre>0).length,dn=L.filter(x=>x.cre<0).length;
  const cols=[{h:'#',v:x=>x._rk,html:posH,t:'int'},{h:'Distri / Directa',v:x=>x.d},{h:'Rol',v:x=>x.r},{h:'SPV',v:x=>x.s},{h:'Promotor',v:x=>x.p,cls:'nm',html:x=>esc(x.p)+(x.prev==null?'<span class="tag">SIN '+pm+'</span>':'')},
    {h:pm+' (cierre)',v:x=>x.prev,t:'pct'},{h:perMes()+(isAct()?' (actual)':''),v:x=>x.pv,t:'pct'},{h:'Crecimiento',v:x=>x.cre,t:'pp',html:x=>ppHtml(x.cre,true)},{h:'Cluster',v:x=>clOf(x.pv)?.k,html:x=>clHtml(x.pv)}];
  return headP('CRECIMIENTO vs '+MES_LARGO[pm],perLabel()+filtLabel()+` · ▲ ${up} crecieron · ▼ ${dn} bajaron`,'t_CRE')+table('t_CRE',cols,L,{c:7,dir:-1});
}
function pCLU(){
  const L=filt(build(perRows()),true).filter(x=>x.env>0);
  const D={};L.forEach(x=>(D[x.d]=D[x.d]||[]).push(x));
  const rows=Object.keys(D).sort().map(d=>{const c=CLS.map(k=>D[d].filter(x=>clOf(x.pv)===k).length);return{d,c,tot:D[d].length,est:c[0]/D[d].length}});
  const tc=CLS.map((k,i)=>rows.reduce((a,r)=>a+r.c[i],0)),tt=tc.reduce((a,b)=>a+b,0)||1;
  let h=headP('DINÁMICA DE CLUSTERS',perLabel()+filtLabel()+` · ${L.length} promotores`,'t_CLU');
  h+=`<div class="legend" style="margin-bottom:10px">${CLS.map(c=>`<span><i style="background:${c.bg}"></i>${c.k} ${c.d}</span>`).join('')}</div>`;
  h+=`<div class="box snap" style="margin-bottom:14px;padding-top:40px">${SNAP('Clusters_distri')}<div class="legend" style="margin-bottom:8px">${CLS.map(c=>`<span><i style="background:${c.bg}"></i>${c.k}</span>`).join('')}</div><div class="drow"><span>TOTAL CUYO</span>${stackBar(tc)}<span>${tt}</span></div>${rows.sort((a,b)=>b.est-a.est).map(r=>`<div class="drow"><span>${esc(r.d)}</span>${stackBar(r.c)}<span>${r.tot}</span></div>`).join('')}</div>`;
  const cols=[{h:'Distribuidor',v:x=>x.d,cls:'nm'},...CLS.map((c,i)=>({h:c.k,v:x=>x.c[i],t:'int',html:x=>x.c[i]?`<b>${x.c[i]}</b> <span style="color:var(--mut);font-size:11px">${nf1.format(x.c[i]/x.tot*100)}%</span>`:'<span style="color:#c5d3de">·</span>'})),{h:'Total',v:x=>x.tot,t:'int'}];
  const totRow={d:'TOTAL',c:tc,tot:tt};
  h+=table('t_CLU',cols,[...rows.sort((a,b)=>a.d<b.d?-1:1),totRow],null);
  // listado
  h+=`<h3 style="margin:22px 0 10px;font-size:17px;font-weight:900;color:var(--navy)">Promotores por cluster</h3><div class="flt">${['',...CLS.map(c=>c.k)].map(k=>{const c=CLS.find(x=>x.k===k);return `<button class="${st.cl===k?'on':''}" style="background:${c?c.bg:'#eef4f9'};color:${c?c.fg:'var(--navy)'}" onclick="st.cl='${k}';render()">${k||'TODOS'}</button>`}).join('')}</div>`;
  const LL=filt(build(perRows())).filter(x=>x.env>0&&(!st.cl||clOf(x.pv).k===st.cl));
  const c2=[{h:'#',v:x=>x._rk,html:posH,t:'int'},{h:'Distri / Directa',v:x=>x.d},{h:'Rol',v:x=>x.r},{h:'SPV',v:x=>x.s},{h:'Promotor',v:x=>x.p,cls:'nm'},{h:'% Validadas',v:x=>x.pv,t:'pct',html:x=>barH(x.pv)},{h:'Cluster',v:x=>clOf(x.pv)?.k,html:x=>clHtml(x.pv)}];
  h+=table('t_CLL',c2,LL,{c:5,dir:-1});
  return h;
}
function spark(x){
  const vs=HMONTHS.map(m=>x['m_'+m]);vs.push(x.act);const W=230,H=40,p=5;const lo=.6,hi=1;

  const pts=vs.map((v,i)=>v==null?null:[X(i),Y(v)]);let d='',on=false;pts.forEach(q=>{if(!q){on=false;return}d+=(on?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)+' ';on=true});
  const yl=x.ytd!=null?`<line x1="${p}" x2="${W-p}" y1="${Y(x.ytd)}" y2="${Y(x.ytd)}" stroke="#9db1c3" stroke-dasharray="3 3"/>`:'';
  const last=pts[pts.length-1];

}

  $('fTgt').value=tgts[cur.mes]??'';
  const A=aggr(build(cur.rows)),t=tgt();
  $('chips').innerHTML=`<div class="chip"><i></i>Carga ${esc(cur.fecha)} · ${cur.mes}</div><div class="chip"><i></i>${cur.rows.length} promotores</div><div class="chip ${A.pv>=t?'y':'r'}"><i></i>Cuyo ${pct(A.pv)} · TGT ${nf1.format(t*100)}%</div>`;
  $('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab ${st.tab===k?'on':''}" data-k="${k}">${l}</button>`).join('');
  $('panel').innerHTML=TABS.find(x=>x[0]===st.tab)[2]();
}
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tab[data-k]');if(tb){st.tab=tb.dataset.k;st.sort=null;render();return}
  const th=e.target.closest('th');if(th){const id=th.closest('table').dataset.id,c=+th.dataset.c;const s=st.sort&&st.sort.id===id?st.sort:null;st.sort={id,c,dir:s&&s.c===c?-s.dir:-1};render()}
});
$('fPer').onchange=e=>{st.per=e.target.value;st.dis=st.spv='';render()};
$('fDis').onchange=e=>{st.dis=e.target.value;st.spv='';render()};
$('fSpv').onchange=e=>{st.spv=e.target.value;render()};
$('fEdv').onchange=e=>{st.edv=e.target.value;render()};
let qt;$('fQ').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{st.q=e.target.value;render();$('fQ').focus()},250)};
$('fTgt').onchange=e=>{tgts[cur.mes]=parseFloat(String(e.target.value).replace(',','.'))||0;LS.set('lc_tgt',tgts);render()};
$('fMes').onchange=e=>{const m=e.target.value;cur={...cur,mes:m};if(tgts[m]==null)tgts[m]=tgts[DEFAULT_CUR.mes]||0;LS.set('lc_cur',cur);LS.set('lc_tgt',tgts);if(prevLoad&&prevLoad.mes!==m)prevLoad=null;render()};
function togRol(k){st.rolsH=st.rolsH.includes(k)?st.rolsH.filter(x=>x!==k):[...st.rolsH,k];LS.set('lc_rolsH',st.rolsH);render()}
$('bClr').onclick=()=>{Object.assign(st,{dis:'',spv:'',edv:'',q:'',cl:'',sort:null});$('fQ').value='';render()};

/* ---------- carga ---------- */
$('bLoad').onclick=()=>$('file').click();
$('file').onchange=e=>{if(e.target.files[0])readFile(e.target.files[0]);e.target.value=''};
let dc=0;
addEventListener('dragenter',e=>{e.preventDefault();dc++;$('drop').classList.add('on')});
addEventListener('dragleave',e=>{dc--;if(dc<=0){dc=0;$('drop').classList.remove('on')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;$('drop').classList.remove('on');const f=e.dataTransfer.files[0];if(f)readFile(f)});
function loadTasks(A,hi){
  const H=A[hi].map(norm),ix=n=>H.indexOf(n);
  const c={d:ix('DISTRI / DIRECTA'),p:ix('PILAR DE LA LIGA'),v:ix('VARIABLE DE LA LIGA'),ta:ix('TAREA'),e:ix('# ENVIADAS'),co:ix('% COMPLETADAS'),j:ix('% JUSTIFICADAS'),pv:ix('% VALIDADAS')};
  if(['d','p','v','e','co','j','pv'].some(k=>c[k]<0))throw new Error('Al export de tareas le faltan columnas: DISTRI, PILAR, VARIABLE DE LA LIGA, (TAREA), # Enviadas, % Completadas, % Justificadas, % Validadas');
  const rows=[];let lD='',lP='',lV='';
  const n=x=>{if(typeof x==='string'){const pc=/%/.test(x);x=parseFloat(x.replace('%','').replace(/\./g,'').replace(',','.'));if(pc)x/=100}return +x||0};
  for(const r of A.slice(hi+1)){if(!r)continue;const d=norm(r[c.d])||lD,p=norm(r[c.p])||lP;let v=String(r[c.v]==null?'':r[c.v]).trim()||lV;lD=d;lP=p;lV=v;
    if(d.startsWith('FILTROS')||d==='TOTAL'||p==='TOTAL'||norm(v)==='TOTAL'||!v)continue;
    let ta=v;if(c.ta>=0){ta=String(r[c.ta]==null?'':r[c.ta]).trim();if(!ta||norm(ta)==='TOTAL')continue}
    rows.push([d,p,v,ta,n(r[c.e]),n(r[c.co]),n(r[c.j]),n(r[c.pv])])}
  if(!rows.length)throw new Error('El export de tareas no tiene filas.');
  const d=new Date(),fecha=d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});
  tasksPrev=tasks&&tasks.mes===cur.mes&&tasks.rows[0]&&tasks.rows[0].length===8?tasks:null;tasks={mes:cur.mes,fecha,rows};
  LS.set('lc_tasks',tasks);LS.set('lc_tasks_prev',tasksPrev);
  st.tab='TAR';st.pil='';render();toast(`✅ Tareas cargadas: ${new Set(rows.map(r=>r[1])).size} pilares · ${new Set(rows.map(r=>r[1]+r[2])).size} variables · ${new Set(rows.map(r=>r[3])).size} tareas`);
}
function readFile(f){
  if(typeof XLSX==='undefined'){toast('No se pudo cargar el lector de Excel. Revisá la conexión a internet.');return}
  const r=new FileReader();
  r.onload=ev=>{try{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
    const A=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null});
    const ti=A.findIndex(r=>r&&r.some(c=>norm(c)==='VARIABLE DE LA LIGA'));
    if(ti>=0){loadTasks(A,ti);return}
    let hi=A.findIndex(r=>r&&r.some(c=>norm(c)==='PROMOTOR')&&r.some(c=>norm(c)==='# ENVIADAS'));
    if(hi<0)throw new Error('No encontré las columnas PROMOTOR y # Enviadas. ¿Es el export de Productividad?');
    const H=A[hi].map(norm),ix=n=>H.indexOf(n);
    const c={d:ix('DISTRI / DIRECTA'),s:ix('SPV'),r:ix('ROL DEL PROMOTOR'),p:ix('PROMOTOR'),v:ix('# VALIDADAS'),i:ix('# INVALIDADAS'),j:ix('# JUSTIFICADAS'),e:ix('# ENVIADAS')};
    const miss=Object.entries(c).filter(([k,v])=>v<0);if(miss.length)throw new Error('Faltan columnas en el export: DISTRI, SPV, ROL, PROMOTOR, # Validadas, # Invalidadas, # Justificadas, # Enviadas');
    const rows=[];
    for(const r of A.slice(hi+1)){if(!r)continue;const p=norm(r[c.p]),s=norm(r[c.s]),ro=norm(r[c.r]);
      if(!p||[p,s,ro].includes('TOTAL'))continue;if(EXCL_ROLES.includes(ro))continue;
      const n=x=>+x||0;rows.push([norm(r[c.d]),s,ro,p,n(r[c.v]),n(r[c.i]),n(r[c.j]),n(r[c.e])])}
    if(!rows.length)throw new Error('El archivo no tiene filas de promotores.');
    const d=new Date(),fecha=d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});
    prevLoad=cur.rows?{mes:cur.mes,fecha:cur.fecha,rows:cur.rows}:null;
    cur={mes:$('fMes').value||cur.mes,fecha,rows};
    if(prevLoad&&prevLoad.mes!==cur.mes)prevLoad=null;
    LS.set('lc_cur',cur);LS.set('lc_prev',prevLoad);
    const nuevos=rows.filter(r=>!HMONTHS.some(m=>histMaps[m][r[3]])).map(r=>r[3]);
    st.per='ACTUAL';render();
    toast(`✅ Base cargada: ${rows.length} promotores`+(nuevos.length?`<br>⚠ Sin historial (¿nuevos o nombre distinto?): ${nuevos.slice(0,8).join(', ')}${nuevos.length>8?'…':''}`:''));
  }catch(err){toast('❌ '+esc(err.message))}};
  r.readAsArrayBuffer(f);
}

/* ---------- exportar ---------- */
function sheetOf(id){
  const {cols:C0,data}=EXP[id];const cols=C0.filter(c=>!c.noX);
  const aoa=[cols.map(c=>c.h)];
  data.forEach(x=>aoa.push(cols.map(c=>{let v=c.v(x);if(v==null||v===''||(typeof v==='number'&&isNaN(v)))return '';if(c.t==='pct'||c.t==='pp')return{t:'n',v:+v,z:'0.0%'};return v})));
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=cols.map(c=>({wch:Math.max(8,c.h.length+2,c.t?10:22)}));return ws;
}
function fname(){return `LA_CUYONETA_RANKING_${perMes()}_${ANIO}`}
function dlXls(id){if(typeof XLSX==='undefined')return toast('Sin conexión para exportar');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheetOf(id),id.replace('t_',''));XLSX.writeFile(wb,`${fname()}_${id.replace('t_','')}.xlsx`)}
$('bAll').onclick=()=>{
  if(typeof XLSX==='undefined')return toast('Sin conexión para exportar');
  const keep=st.tab,keepCl=st.cl,wb=XLSX.utils.book_new();
  const names={t_KT:'K+T',t_AS:'AS',t_MER:'MERCHAND',t_SPV:'SPV',t_SPVY:'SPV YTD',t_EDV:'EDV',t_EDVY:'EDV YTD',t_JUS:'JUSTIFICACION',t_CRE:'CRECIMIENTO',t_CLU:'CLUSTER DIN',t_TAR:'TAREAS RANKING',t_TARD:'TAREAS x DISTRI',t_CLL:'CLUSTER',t_HIS:'HISTORICO YTD'};
  st.cl='';
  TABS.slice(1).forEach(([k])=>{st.tab=k;st.sort=null;EXP={};$('panel').innerHTML=TABS.find(x=>x[0]===k)[2]();Object.keys(EXP).sort((x,y)=>x.length-y.length).forEach(id=>{if(names[id])XLSX.utils.book_append_sheet(wb,sheetOf(id),names[id])})});
  st.tab=keep;st.cl=keepCl;render();XLSX.writeFile(wb,fname()+'.xlsx');
};
const SNAP=n=>`<button class="snapb" data-n="${n}" onclick="snapEl(this)">📷 PNG</button>`;
async function snapEl(btn){
  if(typeof html2canvas==='undefined')return toast('Sin conexión para exportar imagen');
  const el=btn.closest('.snap');const tw=Math.max(0,...[...el.querySelectorAll('table')].map(x=>x.scrollWidth));
  el.classList.add('capping');const ow=el.style.width;if(tw+40>el.offsetWidth)el.style.width=(tw+40)+'px';
  try{const c=await html2canvas(el,{scale:3,backgroundColor:'#ffffff'});const a=document.createElement('a');a.download=`${fname()}_${btn.dataset.n}.png`;a.href=c.toDataURL('image/png');a.click();toast('📷 Imagen descargada')}
  finally{el.classList.remove('capping');el.style.width=ow}
}
async function dlImg(btn){
  if(typeof html2canvas==='undefined')return toast('Sin conexión para exportar imagen');
  const sn=btn&&btn.closest('.snap');if(sn){const b=document.createElement('button');b.dataset.n=st.tab;sn.appendChild(b);b.className='snapb';await snapEl(b);b.remove();return}
  const p=$('panel');const tw=Math.max(0,...[...p.querySelectorAll('table')].map(x=>x.scrollWidth));p.classList.add('cap');if(tw+48>p.offsetWidth)p.style.width=(tw+48)+'px';
  try{const c=await html2canvas(p,{scale:2,backgroundColor:'#ffffff',windowWidth:Math.max(p.scrollWidth+60,1200)});
    const a=document.createElement('a');a.download=`${fname()}_${st.tab}.png`;a.href=c.toDataURL('image/png');a.click();}
  finally{p.classList.remove('cap');p.style.width=''}
}
render();
</script>
